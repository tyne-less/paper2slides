name: deploy

# Manual only: rolls a new image out to infrastructure created beforehand with
# service/deploy/deploy.sh (Terraform). Needs repository variables GCP_PROJECT_ID,
# GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOYER_SERVICE_ACCOUNT
# (Terraform outputs). No service-account key is stored in GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/p2s/p2s-service:${GITHUB_SHA::12}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f service/Dockerfile -t "$image" .
          docker push "$image"
      - name: Migrate, then roll out API and worker
        run: |
          gcloud run jobs update p2s-migrate --image "$IMAGE" --region "$REGION"
          gcloud run jobs execute p2s-migrate --wait --region "$REGION"
          gcloud run deploy p2s-api --image "$IMAGE" --region "$REGION"
          gcloud run jobs update p2s-worker --image "$IMAGE" --region "$REGION"
