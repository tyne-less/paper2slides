[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2slides"
version = "0.1.0"
description = "Evaluation-driven multimodal research pipeline for academic PDF to slide transformation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
